name = "xeith-v2"
main = "worker.js"
compatibility_date = "2026-11-23"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
LLM_BASE_URL = "https://api.groq.com/openai/v1"
LLM_MODEL = "qwen/qwen3.8-27b"

# Cloudflare D1 Database binding for Leaderboards, Streaks, Friends & Gallery
# Once created in Dashboard -> Storage & Databases -> D1 -> "xeith-db", uncomment:
# [[d1_databases]]
# binding = "DB"
# database_name = "xeith-db"
# database_id = "YOUR_D1_DATABASE_UUID"

